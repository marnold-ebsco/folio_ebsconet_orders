; FOLIO tenant connection for the EBSCONET scripts.
; Copy this file to <tenant>.ini, fill in the values after the = signs, and pass it with
; --ini <tenant>.ini. Quotes are optional.
; A filled-in copy holds live credentials: never commit or share it (*.ini is
; git-ignored except this sample).

name        = ""
okapiUrl    = ""
tenant_id   =
username    =
password    =
; true, false, or the path to a CA certificate bundle
sslVerify   = true
